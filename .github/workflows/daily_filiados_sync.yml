name: Daily Filiados Ingestion & Data Lake Sync

on:
  schedule:
    # Múltiplas execuções com minutos quebrados (menos concorridos no GitHub):
    # - 01:23 BRT (04:23 UTC) -> Fechamento / consolidação do dia anterior na madrugada
    # - 07:19 BRT (10:19 UTC) -> Primeira checagem matinal antes do início do expediente
    # - 10:23 BRT (13:23 UTC) -> Primeira tentativa logo após o envio do ThoughtSpot (10:00 BRT)
    # - 11:37 BRT (14:37 UTC) -> Segunda tentativa para garantir atualização ainda pela manhã
    # - 14:19 BRT (17:19 UTC) -> Atualização do início da tarde
    # - 17:41 BRT (20:41 UTC) -> Atualização de fechamento do dia
    - cron: '23 04 * * *'
    - cron: '19 10 * * *'
    - cron: '23 13 * * *'
    - cron: '37 14 * * *'
    - cron: '19 17 * * *'
    - cron: '41 20 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Forçar reprocessamento de arquivos já ingeridos (--force)'
        required: false
        type: boolean
        default: false

jobs:
  sync-filiados:
    name: Coleta Gmail, Data Lake & Ingestão ETL
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Instalar Dependências do Sistema e Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Ingestão do E-mail e Atualização do Data Lake
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python email_ingestion.py --force
          else
            python email_ingestion.py
          fi
