name: Daily Filiados Ingestion & Data Lake Sync

on:
  schedule:
    # Executa diariamente às 10:15 BRT (13:15 UTC), 15 min após o disparo do ThoughtSpot (10:00 BRT)
    - cron: '15 13 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Forçar reprocessamento de arquivos já ingeridos (--force)'
        required: false
        type: boolean
        default: false

jobs:
  sync-filiados:
    name: Coleta Gmail, Data Lake & Ingestão ETL
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Instalar Dependências do Sistema e Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Ingestão do E-mail e Atualização do Data Lake
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python email_ingestion.py --force
          else
            python email_ingestion.py
          fi
